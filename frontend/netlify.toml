[build]
  base    = ""
  command = "npm run build"
  publish = "dist"

# Proxy /api/* → Railway backend
# Thay RAILWAY_URL bằng URL thực sau khi deploy Railway
[[redirects]]
  from   = "/api/*"
  to     = "https://webhoangyen-production.up.railway.app/api/:splat"
  status = 200
  force  = true

# SPA fallback — phải đặt CUỐI CÙNG
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
